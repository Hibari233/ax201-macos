name: Validate AX201 development

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline parser and scheduler tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test.py

  build:
    name: Sequoia x86_64 (${{ matrix.variant }})
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        variant: [wifi, awdl]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned MacKernelSDK
        run: python3 scripts/bootstrap_sdk.py
      - name: Build kext
        run: python3 scripts/build_sequoia.py --variant "${{ matrix.variant }}" --jobs 3
      - name: Compile native ABI fixture and diagnostic client
        if: matrix.variant == 'awdl'
        run: |
          python3 scripts/build_sequoia.py --native-abi-test --out build/native-abi
          python3 scripts/build_awdlctl.py
      - name: Retain build provenance
        uses: actions/upload-artifact@v4
        with:
          name: sequoia-${{ matrix.variant }}-provenance
          path: build/${{ matrix.variant }}/build-manifest.json
          if-no-files-found: error
      # Binary releases remain manual until hardware acceptance is documented.
